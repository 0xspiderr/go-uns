version: '3.8'

services:
  # 1. The PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: uns_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata_secure:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. pgAdmin (Web Interface for Postgres)
  pgadmin:
    image: dpage/pgadmin4
    container_name: uns_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@uns.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy

  # 3. The Mosquitto MQTT Broker
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: uns_broker
    ports:
      - "1884:1884"
    volumes:
      - ./mosquitto_config.conf:/mosquitto/config/mosquitto.conf:ro

  # 4. Your Go Application
  uns-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uns_middleware
    ports:
      - "10000:10000"
    env_file:
      - .env
    depends_on:
      mosquitto:
        condition: service_started
      db:
        condition: service_healthy

volumes:
  pgdata_secure:
